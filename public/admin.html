<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>หลังบ้านแอดมิน</title>
<style>
  :root { --bg:#f4f6f4; --fg:#1f2a24; --card:#fff; --line:#cfd8d2; --muted:#6b7a71; --green:#1f7a4d;
          box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a16; --fg:#e6ede8; --card:#1e2621; --line:#35423a; --muted:#8c9c92; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Sarabun", "Noto Sans Thai", sans-serif; background: var(--bg); color: var(--fg); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 14px 14px 60px; }
  h1 { font-size: 19px; margin: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  input, select, button { font-family: inherit; font-size: 16px; }
  input, select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); }
  button { cursor: pointer; border: 0; border-radius: 10px; padding: 10px 14px; background: var(--green); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 400; }
  button.red { background: #c0392b; }
  button.small { padding: 8px 12px; font-size: 14px; }
  button:disabled { opacity: .5; }
  .hint { font-size: 13px; color: var(--muted); }
  .err { color: #c0392b; font-size: 14px; min-height: 18px; margin-top: 8px; }
  #login { max-width: 360px; margin: 60px auto 0; }
  #login input { margin: 10px 0; }
  #app { display: none; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .stat b { display: block; font-size: 24px; color: var(--green); }
  .spots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 8px; }
  .tile { font-size: 10px; text-align: center; padding: 6px 0; border-radius: 6px; background: var(--green); color: #fff; }
  .tile.busy { background: #8a978f; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .filters .full { grid-column: 1 / -1; }
  .filters label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  .b { border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .b .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .spot { font-size: 20px; font-weight: 700; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 10px; color: #fff; white-space: nowrap; }
  .s-pending_payment { background: #b7791f; } .s-awaiting_confirm { background: #c05621; }
  .s-confirmed { background: #1f7a4d; } .s-rejected { background: #c0392b; } .s-cancelled { background: #8a978f; }
  .code { font-weight: 700; letter-spacing: 2px; color: var(--green); }
  .b .meta { font-size: 14px; line-height: 1.7; margin-top: 4px; }
  .b a { color: inherit; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .slip { max-height: 90px; border-radius: 8px; margin-top: 8px; display: block; }
  .src { font-size: 11px; border: 1px solid var(--line); border-radius: 8px; padding: 1px 6px; color: var(--muted); margin-left: 4px; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); max-width: 560px; margin: 0 auto; background: #1f2a24; color: #fff; padding: 12px 14px; border-radius: 12px; display: none; z-index: 10; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="card">
    <h1>หลังบ้านแอดมิน</h1>
    <input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
    <button id="loginBtn" style="width:100%">เข้าสู่ระบบ</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="app">
    <div class="top">
      <h1>⛺ หลังบ้านการจอง</h1>
      <div style="display:flex;gap:6px">
        <button class="ghost small" id="refresh">รีเฟรช</button>
        <button class="ghost small" id="logout">ออก</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="hint">รอยืนยันสลิป</span><b id="stWaiting">-</b></div>
      <div class="stat"><span class="hint">พักอยู่วันนี้ (รายการ)</span><b id="stStaying">-</b></div>
      <div class="stat"><span class="hint">เข้าพักวันนี้ (รายการ)</span><b id="stArriving">-</b></div>
      <div class="stat"><span class="hint">ยอดยืนยันเดือนนี้ (บาท)</span><b id="stRevenue">-</b></div>
    </div>

    <div class="card">
      <div class="hint" id="spotsTitle">สถานะจุดคืนนี้</div>
      <div class="spots" id="spots"></div>
      <div class="hint" style="margin-top:8px"><span style="color:var(--green)">■</span> ว่าง &nbsp;<span style="color:#8a978f">■</span> ไม่ว่างหรือถูกกันไว้ (รวมรอชำระเงิน)</div>
    </div>

    <div class="card filters">
      <div class="full"><label>ค้นหา (ชื่อ / เบอร์ / รหัสจอง)</label><input id="q" placeholder="พิมพ์เพื่อค้นหา"></div>
      <div><label>สถานะ</label>
        <select id="status">
          <option value="">ทั้งหมด</option>
          <option value="awaiting_confirm">รอยืนยันสลิป</option>
          <option value="confirmed">ยืนยันแล้ว</option>
          <option value="pending_payment">รอชำระเงิน</option>
          <option value="rejected">ไม่ผ่านการยืนยัน</option>
          <option value="cancelled">ยกเลิก</option>
        </select></div>
      <div><label>&nbsp;</label><button class="ghost" id="csv" style="width:100%">ส่งออก CSV</button></div>
      <div><label>เข้าพักตั้งแต่</label><input id="from" type="date"></div>
      <div><label>ถึง</label><input id="to" type="date"></div>
    </div>

    <div class="hint" id="count" style="margin:0 2px 8px"></div>
    <div id="list"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString('th-TH');
const STATUS_TH = {
  pending_payment: 'รอชำระเงิน', awaiting_confirm: 'รอยืนยันสลิป', confirmed: 'ยืนยันแล้ว',
  rejected: 'ไม่ผ่านการยืนยัน', cancelled: 'ยกเลิก',
};
let token = sessionStorage.getItem('adm') || '';
let current = [];
let timer = null, debounce = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 6000);
}

async function api(path, opts = {}) {
  const r = await fetch('/api/admin' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
  });
  if (r.status === 401) { logout(); throw new Error('หมดเวลา กรุณาเข้าสู่ระบบใหม่'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'เกิดข้อผิดพลาด');
  return d;
}

// ---------- ล็อกอิน ----------
async function login() {
  $('loginErr').textContent = ''; $('loginBtn').disabled = true;
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'เข้าสู่ระบบไม่สำเร็จ');
    token = d.token; sessionStorage.setItem('adm', token); $('pw').value = '';
    start();
  } catch (e) { $('loginErr').textContent = e.message; }
  $('loginBtn').disabled = false;
}

function logout() {
  token = ''; sessionStorage.removeItem('adm');
  clearInterval(timer); timer = null;
  $('app').style.display = 'none'; $('login').style.display = 'block';
}

function start() {
  $('login').style.display = 'none'; $('app').style.display = 'block';
  loadAll();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) loadAll(true); }, 30000);
}

// ---------- ข้อมูล ----------
async function loadAll(quiet) {
  try { await Promise.all([loadStats(), loadList()]); }
  catch (e) { if (!quiet) toast(e.message); }
}

async function loadStats() {
  const s = await api('/stats');
  $('stWaiting').textContent = s.waiting;
  $('stStaying').textContent = s.staying;
  $('stArriving').textContent = s.arriving_today;
  $('stRevenue').textContent = fmt(s.revenue_month);
  $('spotsTitle').textContent = `สถานะจุดคืนนี้ (${s.today}) | ว่าง ${s.free.length}/${s.all.length}`;
  const free = new Set(s.free);
  const box = $('spots'); box.textContent = '';
  s.all.forEach((n) => box.appendChild(el('div', 'tile' + (free.has(n) ? '' : ' busy'), n)));
}

async function loadList() {
  const p = new URLSearchParams();
  if ($('status').value) p.set('status', $('status').value);
  if ($('q').value.trim()) p.set('q', $('q').value.trim());
  if ($('from').value) p.set('from', $('from').value);
  if ($('to').value) p.set('to', $('to').value);
  const d = await api('/bookings?' + p.toString());
  current = d.bookings;
  render();
}

function render() {
  const list = $('list'); list.textContent = '';
  $('count').textContent = `${current.length} รายการ (แสดงล่าสุดไม่เกิน 300)`;
  if (!current.length) { list.appendChild(el('div', 'card hint', 'ไม่พบรายการ')); return; }
  current.forEach((b) => list.appendChild(card(b)));
}

function card(b) {
  const c = el('div', 'b');
  const top = el('div', 'row');
  const left = el('div');
  left.appendChild(el('div', 'spot', 'จุด ' + b.spot));
  if (b.code) left.appendChild(el('div', 'code', b.code));
  top.appendChild(left);
  const right = el('div'); right.style.textAlign = 'right';
  right.appendChild(el('span', 'badge s-' + b.status, STATUS_TH[b.status] || b.status));
  right.appendChild(el('span', 'src', b.source === 'web' ? 'เว็บ' : 'LINE'));
  top.appendChild(right);
  c.appendChild(top);

  const m = el('div', 'meta');
  m.appendChild(document.createTextNode(b.name + ' | '));
  const tel = el('a', null, b.phone); tel.href = 'tel:' + b.phone; m.appendChild(tel);
  m.appendChild(el('br'));
  m.appendChild(document.createTextNode(`${b.check_in} ถึง ${b.check_out} | ${b.guests} คน | ${fmt(b.total)} บาท`));
  m.appendChild(el('br'));
  const addr = el('span', 'hint', b.address); m.appendChild(addr);
  m.appendChild(el('br'));
  m.appendChild(el('span', 'hint', 'จองเมื่อ ' + new Date(b.created_at).toLocaleString('th-TH')));
  if (b.checked_in_at) { m.appendChild(el('br')); m.appendChild(el('b', null, '✔ เช็กอินแล้ว ' + new Date(b.checked_in_at).toLocaleString('th-TH'))); }
  c.appendChild(m);

  if (b.slip_url && b.slip_url.startsWith('https://')) {
    const a = el('a'); a.href = b.slip_url; a.target = '_blank'; a.rel = 'noopener';
    const img = el('img', 'slip'); img.src = b.slip_url; img.alt = 'สลิป'; img.loading = 'lazy';
    a.appendChild(img); c.appendChild(a);
  }

  const acts = el('div', 'acts');
  const add = (label, action, cls, ask) => {
    const bt = el('button', 'small ' + (cls || ''), label);
    bt.onclick = () => act(b, action, ask, bt);
    acts.appendChild(bt);
  };
  if (b.status === 'awaiting_confirm') {
    add('ยืนยัน', 'confirm', '', `ยืนยันการจองจุด ${b.spot} ของ ${b.name}?`);
    add('ปฏิเสธ', 'reject', 'red', `ปฏิเสธการจองของ ${b.name}?`);
  }
  if (b.status === 'confirmed') {
    if (!b.checked_in_at) add('เช็กอิน', 'checkin', '', `เช็กอิน ${b.name} (จุด ${b.spot})?`);
    add('ยกเลิก', 'cancel', 'red', `ยกเลิกการจองของ ${b.name}? (เรื่องคืนเงินต้องจัดการเอง)`);
  }
  if (b.status === 'pending_payment') add('ยกเลิก', 'cancel', 'red', `ยกเลิกการจองของ ${b.name}?`);
  if (acts.children.length) c.appendChild(acts);
  return c;
}

async function act(b, action, ask, btn) {
  if (!confirm(ask)) return;
  btn.disabled = true;
  try {
    const out = await api(`/bookings/${b.id}/${action}`, { method: 'POST', body: '{}' });
    let msg = { confirm: 'ยืนยันแล้ว', reject: 'ปฏิเสธแล้ว', cancel: 'ยกเลิกแล้ว', checkin: 'เช็กอินแล้ว' }[action];
    if (out.code) msg += ` | รหัสจอง ${out.code}`;
    if (action !== 'checkin') {
      if (out.no_line) msg += `\nลูกค้าจองผ่านเว็บ ไม่มี LINE กรุณาโทรแจ้ง ${out.phone}`;
      else if (out.notified) msg += '\nแจ้งลูกค้าทาง LINE แล้ว';
      else msg += '\nแจ้งลูกค้าทาง LINE ไม่สำเร็จ (ลูกค้าอาจบล็อกบอท) กรุณาโทรแจ้ง';
    }
    toast(msg);
  } catch (e) { toast(e.message); }
  loadAll(true);
}

// ---------- ส่งออก CSV ----------
function csv() {
  const head = ['รหัสจอง', 'สถานะ', 'จุด', 'ชื่อ', 'เบอร์', 'ที่อยู่', 'เข้าพัก', 'ออก', 'จำนวนคน', 'ยอด', 'ช่องทาง', 'จองเมื่อ', 'เช็กอิน'];
  const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = current.map((b) => [
    b.code || '', STATUS_TH[b.status], b.spot, b.name, `="${b.phone}"`, b.address,
    b.check_in, b.check_out, b.guests, b.total, b.source === 'web' ? 'เว็บ' : 'LINE',
    b.created_at, b.checked_in_at || '',
  ].map((v, i) => (i === 4 ? v : q(v))).join(','));
  const blob = new Blob(['\ufeff' + [head.map(q).join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bookings-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

// ---------- ผูกเหตุการณ์ ----------
$('loginBtn').onclick = login;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('logout').onclick = logout;
$('refresh').onclick = () => loadAll();
$('csv').onclick = csv;
['status', 'from', 'to'].forEach((id) => $(id).addEventListener('change', () => loadList().catch((e) => toast(e.message))));
$('q').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(() => loadList().catch((e) => toast(e.message)), 400); });

if (token) start();
</script>
</body>
</html>
